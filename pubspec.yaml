name: odiya_news_app
description: "Pulp News - Your trusted source for fresh, summarized local news in your language. Stay informed with the latest stories from credible sources, carefully curated and presented in short, easy-to-read summaries."
publish_to: "none"

version: 1.0.0+7

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.1.0
  shared_preferences: ^2.5.3
  firebase_core: ^4.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # cached_network_image: ^3.3.1
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  # flutter_localizations:
  #   sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.2.1
  google_mobile_ads: ^6.0.0
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.4.2
  webview_flutter: ^4.10.1
  xml: ^6.6.1
  touchable: ^1.0.2
  svg_path_parser: ^1.1.2
  firebase_remote_config: ^6.1.0
  package_info_plus: ^9.0.0
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^10.0.0
  flutter_native_splash: ^2.4.3
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: "^0.14.4"
  change_app_package_name: ^1.5.0
  riverpod_generator: ^2.3.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/app_logo.png
    - assets/icons/app_logo.svg
    - assets/icons/explore_logo.svg
    - assets/in.svg

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: assets/icons/app_logo.png
  android: true
  ios: true
  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_logo.png"
  adaptive_icon_background: "#ffffff"
